<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart EMI Loan Planner</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="loginPage">
        <h1>💰 Smart EMI Loan Planner</h1>
        <h2>Login</h2>
        <input type="text" id="username" placeholder="Enter your name" required>
        <button onclick="login()">Login</button>
    </div>

    <div class="container" id="appPage" style="display:none;">
        <h1>💰 Smart EMI Loan Planner</h1>
        <p>Calculate your monthly loan EMI easily!</p>

        <label>Loan Amount (₹)</label>
        <input type="number" id="amount" placeholder="Enter loan amount">

        <label>Annual Interest Rate (%)</label>
        <input type="number" id="rate" placeholder="Enter interest rate" step="any">

        <label>Loan Tenure (Years)</label>
        <input type="number" id="years" placeholder="Enter years">

        <button onclick="calculateEMI()">Calculate EMI</button>

        <div id="result"></div>

        <button onclick="logout()" class="logout">Logout</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
